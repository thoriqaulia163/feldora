<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>FELDORA — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #f5f5f7;
      font-family: Inter, system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 2rem;
      border: 2px solid #2a2a3a;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotate(45deg);
    }
    .icon span {
      transform: rotate(-45deg);
      font-size: 1.5rem;
    }
    h1 {
      font-size: 3rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }
    h1 span { color: #dc2626; }
    .label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: #dc2626;
      margin-bottom: 1rem;
    }
    .diamond {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #dc2626;
      transform: rotate(45deg);
      margin: 0 0.75rem;
    }
    p {
      color: #a1a1aa;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: #dc2626;
      color: white;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 0.8rem;
      text-decoration: none;
      clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
      cursor: pointer;
      border: none;
    }
    .btn:hover { background: #b91c1c; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon"><span>⚡</span></div>
    <div class="label">
      <span class="diamond"></span>
      Connection Lost
      <span class="diamond"></span>
    </div>
    <h1>Off<span>line</span></h1>
    <p>
      You're not connected to the internet. Previously visited pages
      may still be available from cache.
    </p>
    <button class="btn" onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
